name: build-and-deploy

# Manual only, on purpose. Pushing to main must never build or deploy on its own:
# the dev stack is deliberately torn down to $0 between sessions, and the deploy
# this workflow dispatches runs `terraform apply -auto-approve`, which recreates
# the entire Azure environment (and its cost).
#
# To actually ship: Actions > build-and-deploy > Run workflow. That builds the
# image, pushes it to ACR and dispatches the dev deploy, exactly as before.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"

      - name: Build and push
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/saasbase-api"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Dispatch deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: nickolascheidt/SaaSBasePlatform-DevOps
          event-type: deploy
          client-payload: '{"app":"api","image_tag":"${{ github.sha }}","sha":"${{ github.sha }}"}'
