name: build-and-deploy

# Builds the API image and pushes it to ECR. It does not deploy: in the Lightsail design
# the deploy is `deploy/deploy.sh` in the Prumo-DevOps repo, run from a workstation.
#
# Manual on purpose: the AWS infrastructure in Prumo-DevOps was designed but never
# applied, so a push trigger would only produce a red run on every commit. Once the ECR
# exists and the secrets are set, switch to:
#
#   on:
#     push:
#       branches: [main]
#
# Required secrets: AWS_DEPLOY_ROLE_ARN and ECR_REGISTRY, both from `terraform output`
# in the Prumo-DevOps repo.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/prumo-api"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
