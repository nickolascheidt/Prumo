<div style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;color:#1f2430">
  <h1 style="font-size:20px;margin:0 0 16px">Confirme seu e-mail</h1>

  <p style="line-height:1.6">Olá, {{name}}. Sua conta no Prumo foi criada. Falta confirmar
  que este endereço é seu:</p>

  <p style="margin:24px 0">
    <a href="{{link}}"
       style="background:#5e35b1;color:#fff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block">
      Confirmar e-mail
    </a>
  </p>

  <p style="line-height:1.6;color:#5b6472;font-size:14px">O link vale por tempo limitado.
  Se não foi você quem se cadastrou, ignore esta mensagem — sem a confirmação, a conta
  não entra em lugar nenhum.</p>
</div>
