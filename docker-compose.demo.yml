services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biomepampa-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=BiomePampa@Demo2025
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/lib/mssql
    healthcheck:
      test: /opt/mssql-tools*/bin/sqlcmd -S localhost -U sa -P "BiomePampa@Demo2025" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: biomepampa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sqlserver-data:
