services:
  postgres:
    image: postgres:17-alpine
    container_name: saasbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SaaSBasePlatformDb
      # Read by db/roles.sql. Development values, the same as in appsettings.json —
      # anywhere else the passwords come from the environment.
      PRUMO_MIGRATOR_PASSWORD: prumo_migrator_dev
      PRUMO_APP_PASSWORD: prumo_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only runs on a new volume. An existing database gets the script by hand:
      #   docker exec -i saasbase-postgres psql -U postgres -d SaaSBasePlatformDb < db/roles.sql
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
