services:
  postgres:
    image: postgres:17-alpine
    container_name: saasbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SaaSBasePlatformDb
      # Lidas pelo db/roles.sql. Valores de desenvolvimento, iguais aos do
      # appsettings.json — fora daqui as senhas vêm do ambiente.
      PRUMO_MIGRATOR_PASSWORD: prumo_migrator_dev
      PRUMO_APP_PASSWORD: prumo_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Só roda em volume novo. Banco que já existe recebe o script à mão:
      #   docker exec -i saasbase-postgres psql -U postgres -d SaaSBasePlatformDb < db/roles.sql
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila local, no perfil "notifications" — `docker compose up -d` sozinho não a sobe.
  # A API roda sem ela, com um publisher que descarta e avisa no log.
  #   docker compose --profile notifications up -d
  #
  # Substituiu o emulador do Service Bus, que puxava um SQL Server junto e passava de 2 GB
  # para servir um projeto que roda em um container. Efeito colateral bem-vindo: some o
  # ACCEPT_EULA chumbado no compose.
  elasticmq:
    image: softwaremill/elasticmq-native
    container_name: saasbase-elasticmq
    profiles: ["notifications"]
    restart: unless-stopped
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9324:9324"
      - "9325:9325"

volumes:
  postgres-data:
