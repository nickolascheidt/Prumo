services:
  postgres:
    image: postgres:17-alpine
    container_name: saasbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SaaSBasePlatformDb
      # Lidas pelo db/roles.sql. Valores de desenvolvimento, iguais aos do
      # appsettings.json — fora daqui as senhas vêm do ambiente.
      PRUMO_MIGRATOR_PASSWORD: prumo_migrator_dev
      PRUMO_APP_PASSWORD: prumo_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Só roda em volume novo. Banco que já existe recebe o script à mão:
      #   docker exec -i saasbase-postgres psql -U postgres -d SaaSBasePlatformDb < db/roles.sql
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila local, no perfil "notifications" — `docker compose up -d` sozinho não sobe estes
  # dois. São ~2 GB e só fazem falta ao mexer em e-mail; a API roda sem eles, com um
  # publisher que descarta e avisa no log.
  #   docker compose --profile notifications up -d
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: saasbase-servicebus
    profiles: ["notifications"]
    restart: unless-stopped
    volumes:
      - ./servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: saasbase-mssql
      MSSQL_SA_PASSWORD: Prumo@LocalDev1
      # Aceita a EULA do emulador do Service Bus e a do SQL Server Linux. Vale só para
      # este ambiente de desenvolvimento.
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - mssql

  # Dependência do emulador, não da aplicação. O Prumo continua sendo Postgres.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saasbase-mssql
    profiles: ["notifications"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Prumo@LocalDev1

volumes:
  postgres-data:
